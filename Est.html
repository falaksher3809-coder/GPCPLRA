<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CNIC → Stamp Retrieval Link</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --green:#0f7b3a; --green-2:#12924a; --green-soft:#e8f6ee;
    --ink:#0f1b2d; --muted:#5b6b7d; --line:#e4e9ef; --bg:#f4f7fb;
    --red:#c62828;
    --shadow:0 1px 2px rgba(16,24,40,.04), 0 8px 24px rgba(16,24,40,.06);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.5;
    min-height:100vh; display:flex; flex-direction:column;
    -webkit-font-smoothing:antialiased;
  }
  header{
    background:linear-gradient(135deg,#0a5f2d 0%, #12924a 60%, #1faa5a 100%);
    color:#fff; padding:20px 28px; box-shadow:var(--shadow);
  }
  .header-inner{max-width:820px;margin:0 auto;display:flex;align-items:center;gap:14px}
  .crest{
    width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.15);
    display:flex;align-items:center;justify-content:center;font-size:22px;
    border:1px solid rgba(255,255,255,.25);
  }
  .titles h1{margin:0;font-size:16.5px;font-weight:700;letter-spacing:.2px}
  .titles p{margin:2px 0 0;font-size:12.5px;opacity:.85}

  .wrap{max-width:820px;width:100%;margin:36px auto;padding:0 20px;flex:1}
  .card{
    background:#fff;border:1px solid var(--line);border-radius:14px;
    box-shadow:var(--shadow); padding:28px;
  }
  h2{margin:0 0 4px;font-size:18px;font-weight:700}
  .sub{margin:0 0 22px;font-size:13.5px;color:var(--muted)}

  label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);
    text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
  input{
    width:100%; padding:14px 16px; font-size:16px;
    border:1.5px solid var(--line); border-radius:10px; background:#fbfcfe;
    color:var(--ink); font-variant-numeric:tabular-nums; letter-spacing:.6px;
    transition:border-color .15s, box-shadow .15s;
  }
  input:focus{outline:none;border-color:var(--green-2);background:#fff;
    box-shadow:0 0 0 4px rgba(18,146,74,.12)}

  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
  button{
    font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;
    border:0;border-radius:10px;padding:13px 20px;
    transition:transform .06s, filter .15s;
    display:inline-flex;align-items:center;gap:8px;
  }
  button:active{transform:translateY(1px)}
  button:disabled{opacity:.5;cursor:not-allowed}
  .btn-primary{background:linear-gradient(135deg,#0f7b3a,#12924a);color:#fff;
    box-shadow:0 4px 12px rgba(15,123,58,.28)}
  .btn-primary:hover:not(:disabled){filter:brightness(1.06)}
  .btn-ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
  .btn-ghost:hover:not(:disabled){background:#f7fafc}

  .msg{margin-top:16px;padding:12px 14px;border-radius:10px;font-size:14px;display:none}
  .msg.show{display:block}
  .msg.error{background:#fef2f2;color:var(--red);border:1px solid #fecaca}
  .msg.info{background:#eff6ff;color:#1e40af;border:1px solid #dbeafe}

  .result{margin-top:22px; display:none}
  .result.show{display:block}
  .result .box{
    background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:14px 16px;
    display:grid;grid-template-columns:120px 1fr;gap:6px 14px;font-size:13.5px;
  }
  .result .box .k{color:var(--muted);font-size:12px;text-transform:uppercase;
    letter-spacing:.4px;font-weight:600;padding-top:2px}
  .result .box .v{color:var(--ink);word-break:break-all}
  .result .box .v.mono{
    font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:13px;
    background:#fff;border:1px solid var(--line);border-radius:6px;
    padding:6px 10px;display:block;
  }
  .result .box a{color:var(--green);text-decoration:none;
    font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:12.5px;
    word-break:break-all}
  .result .box a:hover{text-decoration:underline}

  .copy-ok{
    display:inline-block;margin-left:8px;color:var(--green);
    font-size:12px;font-weight:600;opacity:0;transition:opacity .2s;
  }
  .copy-ok.show{opacity:1}

  @media (max-width:520px){
    .result .box{grid-template-columns:1fr}
    .result .box .k{padding-top:8px}
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="crest">📜</div>
    <div class="titles">
      <h1>CNIC → Stamp Retrieval Link</h1>
      <p>Generates the Base64 <code>?name=</code> URL for the Punjab e‑Stamping portal</p>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="card">
    <h2>Enter CNIC</h2>
    <p class="sub">13 digits. Dashes and spaces are removed automatically.</p>

    <label for="cnic">CNIC</label>
    <input id="cnic" type="text" inputmode="numeric" autocomplete="off"
           placeholder="34501-6930776-7" maxlength="17" autofocus>

    <div class="actions">
      <button class="btn-primary" id="btnGenerate" onclick="generate()">
        🔗 Generate Link
      </button>
      <button class="btn-ghost" onclick="resetAll()">Reset</button>
    </div>

    <div class="msg" id="msg"></div>

    <div class="result" id="result">
      <div class="box">
        <div class="k">Digits</div>
        <div class="v mono" id="outDigits"></div>

        <div class="k">Base64</div>
        <div class="v mono">
          <span id="outB64"></span>
          <button class="btn-ghost" style="padding:4px 10px;font-size:12px;margin-left:8px"
                  onclick="copyB64()">Copy</button>
          <span class="copy-ok" id="copyOk">Copied!</span>
        </div>

        <div class="k">Full URL</div>
        <div class="v"><a id="outUrl" href="#" target="_blank" rel="noopener"></a></div>
      </div>

      <div class="actions" style="margin-top:18px">
        <button class="btn-primary" id="btnOpen" onclick="openUrl()">
          🚀 Open in New Tab
        </button>
        <button class="btn-ghost" onclick="copyUrl()">Copy URL</button>
      </div>
    </div>
  </div>
</div>

<script>
"use strict";

const PORTAL_URL =
  "https://es.punjab-zameen.gov.pk/eStampCitizenPortal/Stamp/StampRetrievalbyCNIC";

const $ = id => document.getElementById(id);

function setMsg(html, kind){
  const el = $("msg");
  if (!html){ el.className = "msg"; el.innerHTML = ""; return; }
  el.className = "msg show " + kind;
  el.innerHTML = html;
}

/* Auto-format CNIC as XXXXX-XXXXXXX-X while typing */
$("cnic").addEventListener("input", e => {
  const digits = e.target.value.replace(/\D/g, "").slice(0, 13);
  let v = digits;
  if (digits.length > 5)  v = digits.slice(0, 5) + "-" + digits.slice(5);
  if (digits.length > 12) v = v.slice(0, 13) + "-" + digits.slice(12);
  e.target.value = v;
});

$("cnic").addEventListener("keydown", e => {
  if (e.key === "Enter") generate();
});

/* Base64-encode the 13-digit CNIC (no dashes) — matches btoa() on the portal */
function generate(){
  const digits = $("cnic").value.replace(/\D/g, "");

  if (digits.length !== 13){
    setMsg("⚠ Please enter a 13-digit CNIC (currently " + digits.length + " digits).", "error");
    $("result").classList.remove("show");
    return;
  }

  // btoa handles ASCII fine; CNIC is digits so no UTF-8 pitfalls
  const b64 = btoa(digits);
  const url = PORTAL_URL + "?name=" + encodeURIComponent(b64);

  $("outDigits").textContent = digits;
  $("outB64").textContent    = b64;

  const link = $("outUrl");
  link.href        = url;
  link.textContent = url;

  setMsg("", null);
  $("result").classList.add("show");
}

function openUrl(){
  const url = $("outUrl").href;
  if (url && url !== "#"){
    window.open(url, "_blank", "noopener");
  }
}

function copyB64(){
  const txt = $("outB64").textContent;
  navigator.clipboard.writeText(txt).then(() => {
    const ok = $("copyOk");
    ok.classList.add("show");
    setTimeout(() => ok.classList.remove("show"), 1200);
  });
}

function copyUrl(){
  const txt = $("outUrl").href;
  navigator.clipboard.writeText(txt);
}

function resetAll(){
  $("cnic").value = "";
  $("result").classList.remove("show");
  setMsg("", null);
  $("cnic").focus();
}
</script>

</body>
</html>
